name: 19.1 - Concurrency
run-name: 19 - 1 - Concurrency

on:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # cancel-in-progress: true

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.head_ref }}
            -   name: Ping URL
                id: ping-url
                uses: ./.github/actions/docker-ping-url
                with:
                    url: https://wwww.invalid-samoasdadaweqwr.com
                    max_trials: 20
                    delay: 5